[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "langgraph-singlestore"
version = "0.0.1"
description = "SingleStore checkpoint saver and store for LangGraph"
authors = []
readme = "README.md"
repository = "https://github.com/singlestore-labs/langchain-singlestore"
license = "Apache-2.0"
packages = [
    { include = "langgraph" },
]

[tool.poetry.urls]
"Source Code" = "https://github.com/singlestore-labs/langchain-singlestore/tree/main/libs/langgraph-singlestore"
"Release Notes" = "https://github.com/singlestore-labs/langchain-singlestore/releases"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
langgraph-checkpoint = ">=2.0.0,<3.0.0"
singlestoredb = "^1.16.9"
sqlalchemy = "^2.0.40"
# Path dep for in-tree development; publish workflow rewrites this to a
# version constraint (e.g. singlestore-langchain-core = "^0.1.0").
singlestore-langchain-core = { path = "../singlestore-langchain-core", develop = true }

[tool.mypy]
disallow_untyped_defs = "True"
# ``langgraph.checkpoint.singlestore`` and ``langgraph.store.singlestore`` share
# the same leaf name; without these flags mypy sees the two as duplicate
# top-level "singlestore" modules.
namespace_packages = true
explicit_package_bases = true
mypy_path = "."

[tool.ruff.lint]
select = ["E", "F", "I", "T201"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --durations=5"
asyncio_mode = "auto"

[tool.poetry.group.test]
optional = true

[tool.poetry.group.lint]
optional = true

[tool.poetry.group.typing]
optional = true

[tool.poetry.group.test.dependencies]
pytest = ">=7.4.3,<10.0.0"
pytest-asyncio = ">=0.23.2,<2.0.0"
pytest-socket = "^0.7.0"

[tool.poetry.group.lint.dependencies]
ruff = "^0.5"

[tool.poetry.group.typing.dependencies]
mypy = "^1.10"
