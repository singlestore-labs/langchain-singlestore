name: Lint and Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint-and-unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - singlestore-langchain-core
          - langchain-singlestore
          - langgraph-singlestore
    defaults:
      run:
        working-directory: libs/${{ matrix.package }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure Poetry
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      - name: Install dependencies
        run: poetry install --with lint,typing,test

      - name: Run linter
        run: make lint

      - name: Run unit tests
        run: make test

  integration-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: langchain-singlestore
            install-groups: lint,typing,test,test_image,test_integration
            test-target: ci_tests
          - package: langgraph-singlestore
            install-groups: lint,typing,test,test_integration
            test-target: integration_tests
    defaults:
      run:
        working-directory: libs/${{ matrix.package }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure Poetry
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      - name: Install dependencies
        run: poetry install --with ${{ matrix.install-groups }}

      - name: Run integration tests
        run: make ${{ matrix.test-target }}
