name: Publish

# Tags now embed the package name so we can release each library on its own
# cadence:
#
#   langchain-singlestore-v1.5.1
#   singlestore-langchain-core-v0.1.0
#   langgraph-singlestore-v0.0.2
#
on:
  push:
    tags:
      - "singlestore-langchain-core-v*.*.*"
      - "langchain-singlestore-v*.*.*"
      - "langgraph-singlestore-v*.*.*"

jobs:
  build-and-publish:
    name: Build and Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # Full history + tags so we can look up the latest core release tag.
          fetch-depth: 0

      - name: Resolve package + version from tag
        id: pkg
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == singlestore-langchain-core-v* ]]; then
            echo "name=singlestore-langchain-core" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#singlestore-langchain-core-v}" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == langchain-singlestore-v* ]]; then
            echo "name=langchain-singlestore" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#langchain-singlestore-v}" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == langgraph-singlestore-v* ]]; then
            echo "name=langgraph-singlestore" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#langgraph-singlestore-v}" >> "$GITHUB_OUTPUT"
          else
            echo "Unrecognised tag format: $TAG" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure Poetry
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true
          poetry config pypi-token.pypi ${{ secrets.PYPI_TOKEN }}

      - name: Set version from tag
        working-directory: libs/${{ steps.pkg.outputs.name }}
        run: |
          sed -i "s/^version = \".*\"/version = \"${{ steps.pkg.outputs.version }}\"/" pyproject.toml

      # Path deps to singlestore-langchain-core must be rewritten to a version
      # constraint before building, otherwise the resulting wheel would embed a
      # local-path reference that PyPI installs cannot resolve.  Skip for the
      # core package itself.
      - name: Rewrite core path dep to version constraint
        if: steps.pkg.outputs.name != 'singlestore-langchain-core'
        working-directory: libs/${{ steps.pkg.outputs.name }}
        run: |
          CORE_TAG=$(git tag --list 'singlestore-langchain-core-v*.*.*' --sort=-v:refname | head -n1)
          if [[ -z "$CORE_TAG" ]]; then
            echo "No singlestore-langchain-core-v* tag found; cannot pin core version" >&2
            exit 1
          fi
          CORE_VERSION="${CORE_TAG#singlestore-langchain-core-v}"
          echo "Pinning singlestore-langchain-core to ^$CORE_VERSION (from tag $CORE_TAG)"
          sed -i "s|singlestore-langchain-core = { path = \"../singlestore-langchain-core\", develop = true }|singlestore-langchain-core = \"^${CORE_VERSION}\"|" pyproject.toml

      # ``poetry build`` reads pyproject.toml directly and does not resolve or
      # install dependencies, so we intentionally skip ``poetry install`` here.
      # Running install would try to fetch ``singlestore-langchain-core`` from
      # PyPI at its just-pinned version, which fails when core is being
      # released in the same push.
      - name: Build package
        working-directory: libs/${{ steps.pkg.outputs.name }}
        run: poetry build

      - name: Publish to PyPI
        working-directory: libs/${{ steps.pkg.outputs.name }}
        run: poetry publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "${{ steps.pkg.outputs.name }} ${{ steps.pkg.outputs.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
